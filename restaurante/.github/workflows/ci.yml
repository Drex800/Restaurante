name: Calidad

on:
  push:
  pull_request:

jobs:
  servicios:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [usuarios, productos, pedidos]
    defaults:
      run:
        working-directory: ${{ matrix.servicio }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.servicio }}/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff (estilo y errores)
        run: ruff check . && ruff format --check .
      - name: pytest (cobertura mínima 80 %)
        run: pytest --cov=app --cov-fail-under=80
      - name: Bandit (seguridad)
        run: bandit -r app

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
